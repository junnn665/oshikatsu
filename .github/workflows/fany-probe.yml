name: FANY調査（一時）
on:
  push:
    branches: [fany-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/out
          git commit -m "FANY調査結果" || true
          git push origin HEAD:fany-probe
