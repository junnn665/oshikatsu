<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わらうた｜お笑い・アーティストのライブと申込まとめ</title>
<meta name="description" content="芸人のお笑いライブ、アーティストのツアー・フェス、チケットの先行・抽選・一般発売の情報を1日3回自動でまとめる非公式サイト">
<meta property="og:title" content="わらうた">
<meta property="og:description" content="お笑いライブと音楽ライブ、チケット申込の情報を1日3回まとめるサイト">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="わらうた">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="./">
      <img src="assets/icon.svg" alt="" width="36" height="36">
      <span class="logo"><span class="logo-a">わら</span><span class="logo-b">うた</span></span>
    </a>
    <span class="updated" id="updated">1日3回更新</span>
  </div>
</header>

<nav class="genre-bar" aria-label="ジャンル">
  <div class="wrap">
    <div class="genre" role="group">
      <button class="genre-btn" data-genre="all" aria-pressed="true">すべて</button>
      <button class="genre-btn" data-genre="geinin" aria-pressed="false">お笑い</button>
      <button class="genre-btn" data-genre="artist" aria-pressed="false">アーティスト</button>
    </div>
  </div>
</nav>

<main class="wrap main">
  <section class="fany" id="fany" hidden aria-label="FANYで公演を探す">
    <div class="fany-head">
      <span class="fany-title">FANYで公演を探す</span>
      <a class="fany-top" href="https://ticket.fany.lol/" target="_blank" rel="noopener">FANYを開く</a>
    </div>
    <div class="fany-list" id="fany-list"></div>
  </section>

  <section class="tix" id="tix" aria-labelledby="tix-title" hidden>
    <div class="sec-head">
      <h2 id="tix-title" class="sec-title">お笑いライブのチケット</h2>
      <span class="sec-sub" id="tix-count"></span>
    </div>
    <div class="tix-tools">
      <button class="toggle" id="tix-open" aria-pressed="true">受付中だけ</button>
      <span class="tix-src">e+（イープラス）の販売中・販売予定の公演</span>
    </div>
    <ul class="tix-list" id="tix-list"></ul>
    <button class="more more-sub" id="tix-more" hidden>もっと見る</button>
  </section>

  <section id="soon-sec" aria-labelledby="soon-title">
    <div class="sec-head">
      <h2 id="soon-title" class="sec-title">申込がもうすぐ</h2>
      <span class="sec-sub" id="soon-count"></span>
    </div>
    <div class="soon" id="soon"></div>
  </section>

  <section aria-labelledby="feed-title">
    <div class="sec-head">
      <h2 id="feed-title" class="sec-title">新着</h2>
      <span class="sec-sub" id="count"></span>
    </div>

    <div class="toolbar">
      <div class="chips" id="type-chips" role="group" aria-label="種類"></div>
      <div class="tools">
        <label class="search"><input type="search" id="q" placeholder="名前・会場で探す" aria-label="キーワード"></label>
        <select id="area" aria-label="エリア"><option value="">全国</option></select>
        <button class="toggle" id="oshi-only" aria-pressed="false">推しだけ</button>
        <button class="toggle" id="saved-only" aria-pressed="false">★ 保存</button>
      </div>
    </div>

    <div class="grid" id="cards"><p class="empty">読み込み中…</p></div>
    <button class="more" id="more" hidden>もっと見る</button>
  </section>

  <details class="oshi">
    <summary><span class="sec-title">推しリスト</span><span class="sec-sub" id="oshi-count"></span></summary>
    <div class="oshi-body">
      <ul class="oshi-list" id="oshi-list"></ul>
      <form class="oshi-form" id="oshi-form">
        <input type="text" id="oshi-input" placeholder="芸人・アーティスト名" aria-label="推しの名前" autocomplete="off">
        <button type="submit">追加</button>
      </form>
      <p class="note">ここで追加した名前はこの端末にだけ保存され、表示の絞り込みに使います。毎回の検索にも入れたいときは oshi.json に書いてください。</p>
    </div>
  </details>
</main>

<footer class="foot">
  <div class="wrap">
    <p>ニュースサイトや公式発表の見出しを自動で集めた非公式まとめです。日時・申込方法は必ず出典元・公式サイトでご確認ください。掲載の芸人・アーティスト・事務所とは関係ありません。</p>
  </div>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
